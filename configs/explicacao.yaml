# Explicação da previsão (M8, aulas 5.5, 5.6 e 6.3 Tool 4). Lido por previa.drivers.
#
# k: quantos drivers entram na resposta (a aula 5.6 usa 5).
# contexto: o que o marketing não muda e que se cancela entre dois Shorts do mesmo canal (6.3,
#   Tool 4); fica fora do top_drivers. Padrões com * (fnmatch).
# blocos: nome legível -> padrões das colunas que viram um fator só (5.6, erro comum 5). As sondas
#   (sonda_*) e os detectores (det_*) não entram aqui: cada um aparece com o próprio nome.
# min_abs: contribuição com |φ| (log) abaixo disso é desprezível e sai antes do corte em k (aula
#   5.6, "Blocos: o embedding vira visual", `top_drivers(min_abs=0.01)`; 6.3, Tool 4).
k: 5
min_abs: 0.01
contexto: [hist_*, tendencia, dias_desde_ultimo, posts_30d, idade_canal_dias, setor, rel_vizinhos]
blocos:
  "significado do título": [titulo_pc*]
  "capa (SigLIP)": [thumb_pc*]
