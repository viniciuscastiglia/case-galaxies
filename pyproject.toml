[project]
name = "previa"
version = "0.1.0"
description = "Prévia: previsão de curtidas de YouTube Shorts antes da publicação (case Academy x Galaxies)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "faster-whisper==1.2.1",
    "fastmcp==3.4.7",
    "google-api-python-client==2.200.0",
    "google-genai==2.25.0",
    "httpx==0.28.1",
    "isodate==0.7.2",
    "langchain==1.4.2",
    "langchain-core==1.6.5",
    "langchain-google-genai==4.4.0",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.12",
    "librosa==1.0.0",
    "lightgbm==4.7.0",
    "mcp==1.30.0",
    "mlflow==3.16.1",
    "numpy==2.5.3",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.6",
    "pandera==0.33.1",
    "pillow==12.3.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scenedetect==0.7.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "sentence-transformers==6.1.0",
    "shap==0.52.0",
    "tenacity==9.1.4",
    "torch==2.14.0",
    "transformers==5.17.0",
    "yt-dlp[default]==2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # o lint não mexe na documentação

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017"]  # as aulas usam timezone.utc; mantemos o código igual ao delas

[tool.ruff.lint.isort]
known-first-party = ["previa"]
known-local-folder = ["fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
# shap 0.52 (aula 6.6): o import dele chama set_bad/set_over/set_under do matplotlib, que avisa como
# PendingDeprecationWarning (não DeprecationWarning, que é outra classe).
filterwarnings = [
    "ignore:The set_bad function will be deprecated:PendingDeprecationWarning",
    "ignore:The set_over function will be deprecated:PendingDeprecationWarning",
    "ignore:The set_under function will be deprecated:PendingDeprecationWarning",
]

[tool.uv]
# Mac Apple Silicon (a máquina do projeto) e Linux (o CI). No Mac Intel, o shap 0.52 exige um numba
# que não aceita o numpy 2.5 da Stack 2026.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux'"]

# No Linux (o CI), o torch vem do índice só de CPU: o do PyPI traz o CUDA (~2,5 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
