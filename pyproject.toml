[project]
name = "previa"
version = "0.1.0"
description = "Prévia: previsão de curtidas de YouTube Shorts antes da publicação (case Academy x Galaxies)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "google-api-python-client==2.200.0",
    "isodate==0.7.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pandera==0.33.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tenacity==9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # o lint não mexe na documentação

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP017"]  # as aulas usam timezone.utc; mantemos o código igual ao delas

[tool.ruff.lint.isort]
known-first-party = ["previa"]
known-local-folder = ["fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
