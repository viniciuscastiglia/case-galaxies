# CI do Prévia (Fase 5): ruff e pytest, sem dados e sem LLM. Os testes usam bases sintéticas,
# transportes falsos (httpx.MockTransport) e encoders falsos; os que precisam do ffmpeg pulam.
name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
